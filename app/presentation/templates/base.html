<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Marketing con IA</title>
  <style>
    * { box-sizing: border-box; }
    body { font-family: Arial, sans-serif; margin: 0; background: #f4f6fb; color: #1a1a2e; }
    nav { background: #1b1464; padding: 14px 30px; }
    nav a { color: #fff; text-decoration: none; margin-right: 22px; font-weight: bold; }
    main { max-width: 1100px; margin: 25px auto; padding: 0 20px 60px; }
    h2 { margin-top: 0; }
    .card { background: #fff; border-radius: 8px; padding: 20px; margin-bottom: 20px; box-shadow: 0 1px 4px rgba(0,0,0,.08); }
    table { width: 100%; border-collapse: collapse; }
    th, td { padding: 10px; border-bottom: 1px solid #ddd; text-align: left; }
    th { background: #1b1464; color: #fff; }
    label { display: block; font-weight: bold; margin: 14px 0 4px; }
    input[type=text], textarea, select { width: 100%; padding: 9px; border: 1px solid #bbb; border-radius: 4px; font-size: 15px; }
    textarea { min-height: 80px; resize: vertical; }
    button, .btn { background: #1b1464; color: #fff; border: 0; padding: 10px 18px; border-radius: 4px; cursor: pointer; text-decoration: none; font-size: 15px; display: inline-block; }
    button:disabled { background: #888; cursor: wait; }
    .btn-light { background: #e4e6f5; color: #1b1464; }
    .ok { background: #d4edda; padding: 12px; margin-bottom: 14px; border-radius: 4px; }
    .error { background: #f8d7da; padding: 12px; margin-bottom: 14px; border-radius: 4px; }
    .badge { display: inline-block; padding: 3px 9px; border-radius: 12px; font-size: 12px; font-weight: bold; background: #e4e6f5; color: #1b1464; }
    .badge-ia { background: #d4edda; color: #155724; }
    .badge-warn { background: #fff3cd; color: #856404; }
    .grid3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; }
    .scripts .card { margin: 0; border: 2px solid transparent; }
    .scripts .chosen { border-color: #1b1464; }
    .muted { color: #666; font-size: 14px; }
    .imgs img, .photo img { width: 100%; border-radius: 6px; display: block; }
    video { width: 100%; max-width: 320px; border-radius: 8px; background: #000; }
    .sim { background: #fff3cd; color: #856404; padding: 12px; border-radius: 4px; margin: 12px 0; font-weight: bold; }
    .steps { display: flex; gap: 8px; margin-bottom: 20px; flex-wrap: wrap; }
    .step { padding: 6px 12px; border-radius: 16px; background: #e4e6f5; font-size: 13px; }
    .step.done { background: #1b1464; color: #fff; }
    .row { display: flex; gap: 24px; flex-wrap: wrap; }
    .col { flex: 1; min-width: 260px; }
    .check-ok { color: #155724; }
    .check-bad { color: #721c24; }
    @media (max-width: 800px) { .grid3 { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <nav>
    <a href="{{ url_for('main.index') }}">Campañas</a>
    <a href="{{ url_for('main.new') }}">Nueva campaña</a>
  </nav>
  <main>
    {% with messages = get_flashed_messages(with_categories=true) %}
      {% for cat, msg in messages %}<div class="{{ cat }}">{{ msg }}</div>{% endfor %}
    {% endwith %}
    {% block content %}{% endblock %}
  </main>
</body>
</html>
